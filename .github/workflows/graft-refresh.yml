name: Graft Knowledge Graph Refresh

# Rebuilds the Graft semantic layer after each merge to main and publishes
# it as an artifact. The structural graph is free and regenerated locally by
# every agent; only the LLM semantic pass (--deep) is worth building once
# and sharing. Rollout tracked in LuxTronic/code-of-conduct#148.

# No workflow_dispatch: this workflow exposes the org OPENAI_API_KEY secret
# (as GRAFT_API_KEY), and manual
# dispatch would execute the workflow file from an arbitrary ref with the
# secret in scope. Re-run a failed run from the Actions UI instead.
on:
  push:
    branches: [main]

concurrency:
  group: graft-refresh-${{ github.ref }}
  # Queue, don't cancel: on an active repo, cancelling restarts the long
  # first full pass on every merge and it never finishes (the cache saves
  # only on success). A queued run picks up the newer SHA incrementally.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The first full semantic pass (~900 files) needs over an hour;
    # incremental refreshes after it take minutes.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Graft
        run: npm install -g @nanonets/graft@0.16.0

      # Restoring the previous graph lets --deep replay unchanged files from
      # cache, so each merge only pays LLM cost for what actually changed.
      - name: Restore previous graph
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: graft
          key: graft-${{ github.sha }}
          restore-keys: |
            graft-

      # Data egress authorization: sending repository content to OpenAI for
      # the semantic pass, and retaining the resulting graph artifact, is
      # operator-authorized org-wide for this rollout — recorded on
      # LuxTronic/code-of-conduct#148 — using the same org OpenAI account
      # that already processes repository diffs for luxie-tronic reviews.
      - name: Build graph
        id: build
        env:
          GRAFT_PROVIDER: openai
          # Must be a model the org OpenAI project can access: gpt-5.6-luna
          # is the org-standard reviewer model (proven on this key by
          # luxie-tronic); gpt-4o-mini is not enabled on the project (403)
          # and graft's own default id is OpenRouter-style and invalid here.
          GRAFT_MODEL: gpt-5.6-luna
          GRAFT_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$GRAFT_API_KEY" ]; then
            graft build --deep --allow-partial -j 12 2>&1 | tee build.log
            # --allow-partial tolerates transient per-file failures, but a
            # zero-coverage meaning tier is a broken semantic pass, not a
            # partial one — fail loudly instead of shipping a hollow graph.
            # graft reports the meaning tier two ways: a "meaning coverage: x/y"
            # line when the deep pass is degraded, and a "meaning: N computed,
            # …" summary when it completes. Require one of them, so a wording
            # change cannot silently disable this guard, but do not treat a
            # healthy build's summary-only output as a failure.
            if ! grep -qE "meaning coverage:|^ *meaning: [0-9]+ computed" build.log; then
              echo "::error::no meaning-tier report in build output — guard cannot verify the semantic pass"
              exit 1
            fi
            if grep -q "meaning coverage: 0/" build.log; then
              echo "::error::semantic pass produced zero coverage — check GRAFT_MODEL and the API key"
              exit 1
            fi
            if grep -qE "^ *meaning: 0 computed, 0 cached" build.log; then
              echo "::error::semantic pass computed and cached nothing — check GRAFT_MODEL and the API key"
              exit 1
            fi
            echo "::notice::$(grep -oE "meaning coverage: .*|meaning: [0-9]+ computed.*" build.log | tail -1)"
          else
            echo "::warning::OPENAI_API_KEY secret not available — building structural graph only (no semantic pass)"
            echo "structural_only=true" >> "$GITHUB_OUTPUT"
            graft build
          fi

      # Save only a known-good semantic graph — a failed build must not
      # poison the cache, and a structural-only fallback (no key: fork or
      # unauthorized environment) must publish nothing.
      - name: Save graph cache
        if: steps.build.outputs.structural_only != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: graft
          key: graft-${{ github.sha }}

      # Downloadable snapshot for agents and CI jobs that want the shared
      # semantic layer instead of rebuilding it (from this repository):
      #   gh run download --repo LuxTronic/luxtronic-open-webui -n graft-graph -D graft
      # include-hidden-files keeps graft/.graph (wiring) and graft/.cache
      # (LLM summary cache) in the snapshot — without them it cannot seed
      # another environment.
      - name: Upload graph artifact
        if: steps.build.outputs.structural_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graft-graph
          path: graft
          include-hidden-files: true
          overwrite: true
          retention-days: 30
